<!DOCTYPE html>
<html lang="zh-cn" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>管台 | 登录页</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"/>
    <meta http-equiv="X-UA-Compatible" content="IE=edge"/>
    <link rel="stylesheet" th:href="@{/public/css/style.css}">
    <link rel="stylesheet" th:href="@{/public/element/index.css}">
    <style>
        .login-container {
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            background-color: #f0f2f5;
        }
        .login-box {
            width: 450px;
            padding: 20px 30px;
        }
        .login-title {
            text-align: center;
            margin-bottom: 30px;
            color: #409EFF;
        }
        .captcha-img {
            width: 100%;
            height: 40px;
            cursor: pointer;
            border-radius: 4px;
        }
        .login-btn {
            width: 100%;
            margin-top: 10px;
        }
        .el-form-item__content {
            line-height: normal;
        }
    </style>
</head>
<body>
<div id="app">
    <template>
        <div class="login-container">
            <el-card class="login-box">
                <h2 class="login-title">用户登录</h2>
                <el-form :model="userForm" :rules="rules" ref="loginForm" label-position="left"
                         label-width="80px">
                    <!-- 用户名输入 -->
                    <el-form-item label="用户名" prop="userCode">
                        <el-input v-model="userForm.userCode" placeholder="请输入用户名" prefix-icon="el-icon-user"></el-input>
                    </el-form-item>
                    <!-- 密码输入 -->
                    <el-form-item label="密码" prop="password">
                        <el-input v-model="userForm.password" type="password" placeholder="请输入密码"
                                  prefix-icon="el-icon-lock" show-password></el-input>
                    </el-form-item>
                    <!-- 验证码 -->
                    <el-form-item th:if="${loginCaptchaOn}" label="验证码" prop="captcha">
                        <el-row>
                            <el-col :span="14">
                                <el-input v-model="userForm.captcha" placeholder="请输入验证码" prefix-icon="el-icon-picture"
                                ></el-input>
                            </el-col>
                            <el-col :span="9" style="margin-left: 10px">
                                <img :src="captchaUrl" class="captcha-img" alt="验证码" @click="refreshCaptcha">
                            </el-col>
                        </el-row>
                    </el-form-item>

                    <!-- 登录按钮 -->
                    <el-form-item>
                        <el-button type="primary" class="login-btn" @click="handleSubmit">登录
                        </el-button>
                    </el-form-item>
                </el-form>
            </el-card>
        </div>
    </template>
</div>
<script th:src="@{/public/js/vfp.min.js}"></script>
<script th:src="@{/public/js/vue.min.js}"></script>
<script th:src="@{/public/js/axios.min.js}"></script>
<script th:src="@{/public/js/app-utils.js}"></script>
<script th:src="@{/public/element/index.js}"></script>
<script>
    new Vue({
        el: '#app',
        mixins: [AppUtilsMixin],
        data: {
            userForm: {
                userCode: '',
                password: '',
                captcha: ''
            },
            captchaUrl: 'getCaptcha?t=' + Date.now(), // 验证码接口地址
            rules: {
                userCode: [
                    {required: true, message: '请输入用户名', trigger: 'blur'},
                    {min: 3, max: 10, message: '长度在 3 到 10 个字符', trigger: 'blur'}
                ],
                password: [
                    {required: true, message: '请输入密码', trigger: 'blur'},
                    {min: 1, max: 18, message: '长度在 6 到 18 个字符', trigger: 'blur'}
                ],
                captcha: [
                    {required: true, message: '请输入验证码', trigger: 'blur'},
                    {len: 4, message: '验证码长度为4位', trigger: 'blur'}
                ]
            }
        },
        methods: {
            // 刷新验证码
            refreshCaptcha() {
                this.captchaUrl = `getCaptcha?t=${Date.now()}`
            },
            // 提交表单
            handleSubmit() {
                this.$refs.loginForm.validate(valid => {
                    if (valid) {
                        this.$post("login", this.userForm).then(re => {
                            if (re.data && re.data.code === 200) {
                                this.successMsg("登录成功");
                                window.location.href = 'index';
                            } else {
                                this.errorMsg(re.data.msg);
                            }
                        });
                    }
                })
            }
        }
    })
</script>
</body>
</html>
