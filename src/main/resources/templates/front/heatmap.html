<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>热力图</title>
    <link rel="stylesheet" th:href="@{/public/element/index.css}">
    <style th:fragment="heatmap-style">
        .heatmap {
            width: 100%;
            max-width: 900px;
            user-select: none;
        }
        .heatmap-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 10px;
        }
        .heatmap-title {
            font-size: 16px;
            font-weight: 600;
        }
        .heatmap-months {
            display: grid;
            grid-auto-flow: column;
            gap: 3px;
            margin-left: 30px;
            margin-bottom: 6px;
            font-size: 12px;
            color: #59636e;
            overflow: hidden;
            height: 18px;
            line-height: 18px;
        }
        .heatmap-body {
            display: flex;
        }
        .heatmap-weekdays {
            display: grid;
            grid-template-rows: repeat(7, 14px);
            gap: 3px;
            margin-right: 6px;
            font-size: 12px;
            color: #59636e;
            align-content: start;
        }
        .heatmap-weekday-label {
            height: 14px;
            line-height: 14px;
        }
        .heatmap-grid {
            display: grid;
            grid-template-rows: repeat(7, 14px);
            grid-auto-flow: column;
            gap: 3px;
            flex: 1;
            overflow: hidden;
        }
        .heatmap-cell {
            width: 14px;
            height: 14px;
            border-radius: 2px;
            cursor: pointer;
            outline: none;
        }
        .heatmap-cell:hover {
            outline: 1px solid rgba(0, 0, 0, 0.2);
        }
        .heatmap-legend {
            display: flex;
            align-items: center;
            gap: 4px;
            margin-top: 8px;
            margin-left: 30px;
            font-size: 12px;
            color: #59636e;
        }
        .heatmap-legend-cell {
            width: 14px;
            height: 14px;
            border-radius: 2px;
        }
    </style>
</head>
<body>

<div id="app">
    <div th:fragment="heatmap" class="heatmap" ref="heatmap">
        <!-- 控制栏 -->
        <div class="heatmap-header">
            <el-button round icon="el-icon-arrow-left" size="mini" @click="shiftMonth(-1)">上月
            </el-button>
            <span class="heatmap-title" v-text="currentYear+'年'+(currentMonth + 1)+'月'"></span>
            <el-button round icon="el-icon-arrow-right" size="mini" @click="shiftMonth(1)" :disabled="!canNext">下月
            </el-button>
            <el-button round icon="el-icon-refresh" size="mini" @click="shiftMonth(0)">重置</el-button>
            <div class="heatmap-legend">
                <span>少</span>
                <div class="heatmap-legend-cell" v-for="(color,i) in colors" :key="i" :style="{ backgroundColor: color }"></div>
                <span>多</span>
            </div>
        </div>
        <!-- 月份标签 -->
        <div class="heatmap-months">
            <span v-for="(m, i) in visibleMonthLabels" :key="i"
                  :style="{ gridColumn: 'span ' + m.span }" v-text="m.name"></span>
        </div>
        <!-- 热力图 -->
        <div class="heatmap-body">
            <!-- 星期 -->
            <div class="heatmap-weekdays">
                <div class="heatmap-weekday-label"></div>
                <div class="heatmap-weekday-label">周一</div>
                <div class="heatmap-weekday-label"></div>
                <div class="heatmap-weekday-label">周三</div>
                <div class="heatmap-weekday-label"></div>
                <div class="heatmap-weekday-label">周五</div>
                <div class="heatmap-weekday-label"></div>
            </div>
            <!-- 热力图数据 -->
            <div class="heatmap-grid">
                <el-tooltip
                        v-for="(item, idx) in visibleData"
                        :key="idx"
                        :content="item.date+' 发布 '+ item.count + ' 篇'"
                        :placement="getPlacement(idx)"
                        effect="dark"

                        :open-delay="200"
                        :enterable="false">
                    <div class="heatmap-cell"
                         :style="{ backgroundColor: getColor(item.count) }"></div>
                </el-tooltip>
            </div>
        </div>
    </div>
</div>

<script th:src="@{/public/js/vue.min.js}"></script>
<script th:src="@{/public/js/heatmap-utils.js}"></script>
<script th:src="@{/public/element/index.js}"></script>

</body>
</html>
